<header
  id="gh-head"
  class="home-template is-head-left-logo is-dropdown-loaded gh-head gh-outer"
  th:with="menu = ${menuFinder.getPrimary()}"
>
  <div class="gh-head-inner gh-inner">
    <div class="gh-head-brand">
      <div class="gh-head-brand-wrapper">
        <a href="/" class="gh-head-logo">
          <img th:if="${not #strings.isEmpty(site.logo)}" th:src="${site.logo}" th:alt="Logo" />
          <span
            th:if="${#strings.isEmpty(site.logo)}"
            id="site-title"
            class="text-lg font-medium text-gray-900 dark:text-slate-100"
            th:text="${site.title}"
          ></span>
        </a>
      </div>
        <div class="gh-search gh-icon-btn" id="search-icon">
            <a href="javascript:SearchWidget.open()">
                <i class="ri-search-line"></i>
            </a>
        </div>
        <button class="gh-burger"></button>
    </div>
        <nav class="gh-head-menu">
            <ul th:if="${menu != null} and ${not #lists.isEmpty(menu.menuItems)}" class="nav">
                <li
                th:each="menuItem : ${menu.menuItems}">
                <a th:href="@{${menuItem.status.href}}" th:text="${menuItem.status.displayName}"></a>
                </li>
            </ul>
        </nav>
        <div class="gh-head-actions">
            <div class="gh-search gh-icon-btn" id="search-icon">
                <a href="javascript:SearchWidget.open()">
                    <i class="ri-search-line"></i>
                </a>
            </div>
            <div class="gh-head-members">
                <a class="gh-head-link" href="/console" data-portal="signin">Sign in</a>
                <a class="gh-head-btn gh-btn gh-primary-btn" href="/rss.xml" data-portal="signup">Subscribe</a>
            </div>
        </div>
    </div>
  </div>
</header>
<!-- 头部菜单 -->
<script th:src="@{/assets/js/menu.js}"></script>
