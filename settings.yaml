apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-yolo-setting
spec:
  forms:
    - group: cdns
      label: CDN配置
      formSchema:
        - $formkit: radio
          name: jquery
          id: jquery
          label: jquery
          value: false
          options:
            - label: 开启
              value: true
            - label: 关闭
              value: false
        - $formkit: text
          if: "$get(jquery).value"
          name: jquery_url
          label: jquery cdn地址
          value: https://cdn.jsdelivr.net/npm/jquery@3.3.1/dist/jquery.min.js
    - group: fotter
      label: 社交
      formSchema:
        - $formkit: repeater
          name: social_media
          label: 社交媒体
          value: [ ]
          children:
            - $formkit: select
              name: icon
              label: 图标
              options:
                - label: 电子邮箱
                  value: ri-mail-fill
                - label: 微信
                  value: ri-wechat-fill
                - label: 腾讯 QQ
                  value: ri-qq-fill
                - label: 新浪微博
                  value: ri-weibo-fill
                - label: Facebook
                  value: ri-facebook-circle-fill
                - label: Twitter
                  value: ri-twitter-fill
                - label: GitHub
                  value: ri-github-fill
                - label: RSS
                  value: ri-rss-fill
            - $formkit: text
              name: name
              label: 名称
            - $formkit: text
              name: url
              label: 链接
              validation: "required"
            - $formkit: radio
              name: url_type
              label: 链接类型
              value: normal
              help: "如果选择了图片类型，那么在访客点击之后会使用弹框的形式加载"
              options:
                - label: 跳转链接
                  value: normal
                - label: 图片
                  value: image
    - group: beian
      label: 备案设置
      formSchema:
        - $formkit: text
          name: icp_text
          label: ICP备案号
        - $formkit: text
          name: icp_link
          label: ICP备案跳转链接
          value: https://beian.miit.gov.cn/
    - group: Links
      label: 链接
      formSchema:
        - $formkit: text
          name: links_name
          label: 站点名称
        - $formkit: text
          name: links_links
          label: 站点链接
        - $formkit: text
          name: links_icon
          label: 站点Logo
        - $formkit: text
          name: links_ms
          label: 站点描述
    - group: head_img
      label: 头部图片设置
      formSchema:
        - $formkit: attachment
          name: index_patternimg
          label: 首页默认头部图
        - $formkit: attachment
          name: archives_patternimg
          label: 归档页默认头部图
        - $formkit: attachment
          name: photos_patternimg
          label: 相册页默认头部图
        - $formkit: attachment
          name: moments_patternimg
          label: 瞬间页默认头部图  
        - $formkit: attachment
          name: links_patternimg
          label: 友情链接页默认头部图
        - $formkit: attachment
          name: tag_patternimg
          label: 标签页默认头部图
        - $formkit: attachment
          name: categories_patternimg
          label: 分类页默认头部图
        - $formkit: attachment
          name: post_patternimg
          label: 文章页头部图（设置后不显示文章自带首图）
        - $formkit: attachment
          name: page_patternimg
          label: 自定义页头部图
        